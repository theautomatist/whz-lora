services:
  chirpstack:
    image: chirpstack/chirpstack:4.18.0
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./chirpstack:/etc/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      - CHIRPSTACK_API_SECRET=${CHIRPSTACK_API_SECRET}
      - CHIRPSTACK_MQTT_USERNAME=${CHIRPSTACK_MQTT_USERNAME}
      - CHIRPSTACK_MQTT_PASSWORD=${CHIRPSTACK_MQTT_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    mem_limit: 512m
    healthcheck:
      # The LNS had no health check at all, so its three restart attempts on
      # every boot went unnoticed. wget is present in the image; a plain GET on
      # the admin UI proves the HTTP/gRPC listener is actually serving.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4.1.1
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      # This bridge only listens on UDP/1700, so there is no connection to
      # open. Check the bound socket instead: 1700 = 0x06A4 in the hex local
      # address column. Both tables are searched because the listener binds
      # to :: and therefore shows up in udp6, not udp.
      test: ["CMD-SHELL", "grep -qi ':06A4 ' /proc/net/udp /proc/net/udp6 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "1700:1700/udp"
    volumes:
      - ./chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
      - INTEGRATION__MQTT__AUTH__GENERIC__SERVERS=tcp://mosquitto:1883
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=${CHIRPSTACK_MQTT_USERNAME}
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${CHIRPSTACK_MQTT_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_healthy

  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4.1.1
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-eu868.toml
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "3001:3001"
    volumes:
      - ./chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=${CHIRPSTACK_MQTT_USERNAME}
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${CHIRPSTACK_MQTT_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_healthy

  postgres:
    image: postgres:14.23-alpine
    restart: unless-stopped
    volumes:
      - ./postgresql/initdb:/docker-entrypoint-initdb.d
      # Schema lives in named volume 'postgresqldata'.
      # Reset: 'docker compose down -v' before recreating from a different ChirpStack major.
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=chirpstack
    mem_limit: 512m
    healthcheck:
      # interval 30s, not 5s: three services probing every 5 s spawned ~50k
      # processes a day on the Pi for no benefit. start_interval keeps the
      # boot fast anyway — depends_on waits on these, and during start_period
      # the probe still runs every 2 s (finding B-8).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      start_period: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_period: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    entrypoint: ["/mosquitto/config/entrypoint.sh"]
    environment:
      - CHIRPSTACK_MQTT_USERNAME=${CHIRPSTACK_MQTT_USERNAME}
      - CHIRPSTACK_MQTT_PASSWORD=${CHIRPSTACK_MQTT_PASSWORD}
      - MQTT_TEST_USERNAME=${MQTT_TEST_USERNAME}
      - MQTT_TEST_PASSWORD=${MQTT_TEST_PASSWORD}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config/
      - mosquittodata:/mosquitto/data
    mem_limit: 128m
    healthcheck:
      # Tiny authenticated publish round-trip — proves listener is up and
      # auth/ACL accept the credentials. $SYS topics are not retained on
      # mosquitto v2 and publish every 10 s, so probing them is unreliable.
      # Each probe is a real MQTT connection, so it runs every 30 s rather
      # than every 5 s (finding B-8); start_interval keeps the boot fast.
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok -u $$CHIRPSTACK_MQTT_USERNAME -P $$CHIRPSTACK_MQTT_PASSWORD -q 1"]
      interval: 30s
      start_period: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5

  cockpit:
    build: ./cockpit
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHIRPSTACK_HOST=chirpstack:8080
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TEST_USERNAME=${MQTT_TEST_USERNAME}
      - MQTT_TEST_PASSWORD=${MQTT_TEST_PASSWORD}
      - CHIRPSTACK_API_KEY=${CHIRPSTACK_API_KEY}
      - CHIRPSTACK_ADMIN_USER=admin
      - CHIRPSTACK_ADMIN_PASS=admin
      - COCKPIT_USER=${COCKPIT_USER}
      - COCKPIT_PASSWORD=${COCKPIT_PASSWORD}
    volumes:
      - ./cockpit-data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      chirpstack:
        condition: service_started
      mosquitto:
        condition: service_healthy

volumes:
  postgresqldata:
  redisdata:
  mosquittodata:
