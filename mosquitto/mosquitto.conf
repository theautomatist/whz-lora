listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# The health check opens a real MQTT connection on every probe. With connection
# logging on, that wrote ~17k "New connection from" lines a day and grew the
# container log to 259 MB / 1.5M lines in three weeks. The clients here are a
# fixed, known set, so these events carry no diagnostic value. See
# docs/developer/analysis/pi-field-diagnosis-2026-08-01.md (finding B-8).
connection_messages false
