# ChirpStack configuration — whz-lora project.
# Single-region (EU868) deployment for research sensor infrastructure at WHZ.

[logging]
  # "warn", not "info": at info level ChirpStack logs every gateway stats and
  # uplink event, which produced a 322 MB / 664k-line container log in three
  # weeks on the field Pi — SD-card wear with no diagnostic value.
  # See docs/developer/analysis/pi-field-diagnosis-2026-08-01.md (finding B-5).
  level="warn"

[postgresql]
  # DSN uses environment variables injected via Compose.
  dsn="postgres://chirpstack:$POSTGRES_PASSWORD@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0

[redis]
  servers=["redis://$REDIS_HOST/"]
  tls_enabled=false
  cluster=false

[network]
  net_id="000000"
  # Only EU868 is enabled for the WHZ deployment.
  enabled_regions=["eu868"]
  # Fixed-DR ADR plugins for the field test — pin SF9 / SF12 on the
  # network-server side (the MClimate Vicki has no device-side DR command).
  # Selected per device via the device profile's ADR algorithm. See F-0005.
  adr_plugins=[
    "/etc/chirpstack/adr_fixed_dr0.js",
    "/etc/chirpstack/adr_fixed_dr3.js",
    "/etc/chirpstack/adr_fixed_dr5.js",
  ]

[api]
  bind="0.0.0.0:8080"
  # Secret signs login and API tokens — must be set via CHIRPSTACK_API_SECRET.
  secret="$CHIRPSTACK_API_SECRET"

[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    json=true
    # Credentials for ChirpStack's integration MQTT connection to Mosquitto.
    username="$CHIRPSTACK_MQTT_USERNAME"
    password="$CHIRPSTACK_MQTT_PASSWORD"
